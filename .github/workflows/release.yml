name: release-windows
# Release pipeline: 0.3.1 and later

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "app-v*"

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    # Main pushes only publish when the commit is explicitly a release commit.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Publish YTM Desktop')
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare RustyPipe BotGuard sidecar
        shell: pwsh
        run: |
          $version = "0.1.2"
          $expectedHash = "edb9e482ca77e3e4ecd4a2d3270f58c9169f03770db1568b3429cc8cf4c4b279"
          $archive = Join-Path $env:RUNNER_TEMP "rustypipe-botguard.zip"
          $extract = Join-Path $env:RUNNER_TEMP "rustypipe-botguard"
          $url = "https://codeberg.org/ThetaDev/rustypipe-botguard/releases/download/v$version/rustypipe-botguard-v$version-x86_64-pc-windows-msvc.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "rustypipe-botguard checksum mismatch: expected $expectedHash, got $actualHash"
          }

          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Get-ChildItem $extract -Recurse -Filter "rustypipe-botguard.exe" | Select-Object -First 1
          if (-not $binary) { throw "rustypipe-botguard.exe was not found in the verified release archive" }

          New-Item -ItemType Directory -Force "src-tauri/binaries" | Out-Null
          $sidecar = "src-tauri/binaries/rustypipe-botguard-x86_64-pc-windows-msvc.exe"
          Copy-Item $binary.FullName $sidecar -Force
          & $sidecar --version
          if ($LASTEXITCODE -ne 0) { throw "rustypipe-botguard --version failed" }

      - name: Build Windows NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          Write-Host "Release installer: $($installer.Name)"
          Write-Host "SHA-256: $hash"

      - name: Determine release tag
        id: release_meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $package = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "app-v$($package.version)"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing release $tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256

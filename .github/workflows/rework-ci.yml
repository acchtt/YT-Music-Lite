name: rework-windows-check

on:
  push:
    branches:
      - "rework/official-web-player"

concurrency:
  group: rework-official-web-player
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend build
        run: npm run build

      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS test installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: ytm-desktop-0.4.0-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

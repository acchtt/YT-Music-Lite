name: ytmlite-release

on:
  push:
    branches:
      - main

concurrency:
  group: ytmlite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Publish YT Music Lite')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build YT Music Lite
        shell: pwsh
        run: .\yt-music-lite\build.ps1

      - name: Package update
        shell: pwsh
        run: .\yt-music-lite\make-release.ps1

      - name: Publish YT Music Lite release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytmlite-v4.1.0
          target_commitish: ${{ github.sha }}
          name: YT Music Lite v4.1.0
          body: |
            YT Music Lite v4.1.0

            - Completely redesigned native shell with cleaner navigation and spacing.
            - Adds a persistent bottom Now Playing bar with artwork, metadata, seek, transport controls, time, and volume.
            - Redesigns the always-on-top mini player with rounded corners and custom seek/volume controls.
            - Moves utility actions into a dedicated Settings panel.
            - Replaces the permanent Update button with a compact update badge.
            - Keeps in-app GitHub updates, TLS 1.2 support, tray behavior, sleep mode, and the existing YouTube Music WebView2 profile.
          files: |
            yt-music-lite/release/YTMusicLite-v4.1.0-win-x64.zip
            yt-music-lite/release/YTMusicLite-v4.1.0-win-x64.zip.sha256

name: ytmlite-release

on:
  push:
    branches:
      - main

concurrency:
  group: ytmlite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Publish YT Music Lite')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build YT Music Lite
        shell: pwsh
        run: .\yt-music-lite\build.ps1

      - name: Main, official player and settings smoke test
        shell: pwsh
        run: |
          $Root = Resolve-Path .\yt-music-lite
          $Build = Join-Path $Root "build"
          $Csc = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $Csc) { throw "C# compiler not found" }
          & $Csc /nologo /target:exe /platform:x64 /langversion:5 `
            /out:"$Build\YTMusicLite.SmokeTest.exe" `
            /reference:System.dll `
            /reference:System.Core.dll `
            /reference:Accessibility.dll /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll `
            /reference:"$Build\YTMusicLite.exe" `
            (Join-Path $Root "SmokeTest.cs")
          if ($LASTEXITCODE -ne 0) { throw "Smoke test compilation failed" }
          Push-Location $Build
          try {
            .\YTMusicLite.SmokeTest.exe
            if ($LASTEXITCODE -ne 0) { throw "Main/official-player/settings smoke test failed" }
          } finally {
            Pop-Location
          }

      - name: Package update
        shell: pwsh
        run: .\yt-music-lite\make-release.ps1

      - name: Publish YT Music Lite release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytmlite-v4.1.8
          target_commitish: ${{ github.sha }}
          name: YT Music Lite v4.1.8
          body: |
            YT Music Lite v4.1.8

            - Hides the custom native bottom player bar in the main window.
            - Restores YouTube Music's official player bar inside the WebView.
            - Removes the custom expanded-player enhancement layer from startup.
            - Keeps the YT Music Lite top shell, logo, navigation, mini-player, tray controls, Settings, sleep mode and in-app updater.
            - Keeps the official YouTube Music page responsible for like/dislike, shuffle, repeat, queue, lyrics, volume and other playback actions.
          files: |
            yt-music-lite/release/YTMusicLite-v4.1.8-win-x64.zip
            yt-music-lite/release/YTMusicLite-v4.1.8-win-x64.zip.sha256

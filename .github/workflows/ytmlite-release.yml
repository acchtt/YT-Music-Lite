name: ytmlite-release

on:
  push:
    branches:
      - main

concurrency:
  group: ytmlite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Publish YT Music Lite')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build YT Music Lite
        shell: pwsh
        run: .\client\build.ps1

      - name: Install and stage native playback tools
        shell: pwsh
        run: |
          $Build = Resolve-Path .\client\build
          choco install mpv --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'mpv installation failed' }
          $Mpv = Get-ChildItem 'C:\ProgramData\chocolatey\lib\mpvio.install\tools\mpv.exe' -ErrorAction Stop | Select-Object -First 1
          Copy-Item $Mpv.FullName (Join-Path $Build 'mpv.exe') -Force
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile (Join-Path $Build 'yt-dlp.exe')
          $DenoZip = Join-Path $env:RUNNER_TEMP 'deno.zip'
          $DenoDir = Join-Path $env:RUNNER_TEMP 'deno'
          Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile $DenoZip
          Expand-Archive $DenoZip $DenoDir -Force
          Copy-Item (Join-Path $DenoDir 'deno.exe') (Join-Path $Build 'deno.exe') -Force
          & (Join-Path $Build 'mpv.exe') --version
          & (Join-Path $Build 'yt-dlp.exe') --version
          & (Join-Path $Build 'deno.exe') --version

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Playback, memory and interface checks
        shell: pwsh
        run: |
          .\client\measure.ps1
          Push-Location .\client\build
          try {
            $App = Start-Process .\YTMusicLite.exe -ArgumentList '--ui-check' -PassThru
            if (-not $App.WaitForExit(30000)) { $App.Kill(); throw 'UI check timed out' }
            if (-not (Test-Path ui-check.txt) -or (Get-Content ui-check.txt -Raw) -notmatch '^PASS:') { throw 'Native UI check failed' }
          } finally { Pop-Location }

      - name: Package update
        shell: pwsh
        run: |
          .\client\make-release.ps1
          $Build = (Resolve-Path .\client\build).Path
          $Release = (Resolve-Path .\client\release).Path
          $MakeNsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $MakeNsis "/DVERSION=7.1.0" "/DVERSION4=7.1.0.0" "/DBUILDDIR=$Build" "/DOUTDIR=$Release" .\client\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installer build failed' }
          $Installer = Join-Path $Release 'YTMusicLite-v7.1.0-win-x64-setup.exe'
          $Hash = (Get-FileHash -Algorithm SHA256 $Installer).Hash.ToLowerInvariant()
          "$Hash  $(Split-Path $Installer -Leaf)" | Set-Content -Encoding ascii "$Installer.sha256"

      - name: Publish YT Music Lite release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytmlite-v7.1.0
          target_commitish: ${{ github.sha }}
          name: YT Music Lite v7.1.0 — Native Windows
          make_latest: true
          body: |
            YT Music Lite v7.1.0 replaces the WebView2 release with the low-memory Windows-native client.

            - Removes the continuously running WebView2/Chromium process tree.
            - Uses native WinForms controls and audio-only mpv playback.
            - Adds previous, play/pause, next, stop, seek, volume, mute, shuffle, repeat-all, and repeat-one controls.
            - Adds the same transport controls to the mini player, tray menu, keyboard shortcuts, and Windows media keys.
            - Preserves saved music, recent tracks, playlists, and account settings.
            - Enforces a 140 MiB combined client/player memory gate during CI playback tests.
            - Includes both a Windows installer and a portable/in-app-update ZIP.
          files: |
            client/release/YTMusicLite-v7.1.0-win-x64.zip
            client/release/YTMusicLite-v7.1.0-win-x64.zip.sha256
            client/release/YTMusicLite-v7.1.0-win-x64-setup.exe
            client/release/YTMusicLite-v7.1.0-win-x64-setup.exe.sha256

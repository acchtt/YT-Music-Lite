name: ytmlite-release

on:
  push:
    branches:
      - main

concurrency:
  group: ytmlite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Publish YT Music Lite')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build YT Music Lite
        shell: pwsh
        run: .\native-prototype\build.ps1

      - name: Install and stage native playback tools
        shell: pwsh
        run: |
          $Build = Resolve-Path .\native-prototype\build
          choco install mpv --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'mpv installation failed' }
          $Mpv = Get-ChildItem 'C:\ProgramData\chocolatey\lib\mpvio.install\tools\mpv.exe' -ErrorAction Stop | Select-Object -First 1
          Copy-Item $Mpv.FullName (Join-Path $Build 'mpv.exe') -Force
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile (Join-Path $Build 'yt-dlp.exe')
          $DenoZip = Join-Path $env:RUNNER_TEMP 'deno.zip'
          $DenoDir = Join-Path $env:RUNNER_TEMP 'deno'
          Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile $DenoZip
          Expand-Archive $DenoZip $DenoDir -Force
          Copy-Item (Join-Path $DenoDir 'deno.exe') (Join-Path $Build 'deno.exe') -Force
          & (Join-Path $Build 'mpv.exe') --version
          & (Join-Path $Build 'yt-dlp.exe') --version
          & (Join-Path $Build 'deno.exe') --version

      - name: Playback, memory and interface checks
        shell: pwsh
        run: |
          .\native-prototype\measure.ps1
          Push-Location .\native-prototype\build
          try {
            $App = Start-Process .\YTMusicLite.exe -ArgumentList '--ui-check' -PassThru
            if (-not $App.WaitForExit(30000)) { $App.Kill(); throw 'UI check timed out' }
            if (-not (Test-Path ui-check.txt) -or (Get-Content ui-check.txt -Raw) -notmatch '^PASS:') { throw 'Native UI check failed' }
          } finally { Pop-Location }

      - name: Package update
        shell: pwsh
        run: .\native-prototype\make-release.ps1

      - name: Publish YT Music Lite release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytmlite-v5.0.0
          target_commitish: ${{ github.sha }}
          name: YT Music Lite v5.0.0
          body: |
            YT Music Lite v5.0.0

            - Replaces the embedded browser with a native Windows music interface.
            - Adds Home, Search, Library, Queue, local playlists, audio import, and a native mini player.
            - Includes mpv, yt-dlp, and Deno so no manual playback-tool installation is required.
            - Uses on-demand search and stream resolution to keep idle memory low.
            - Keeps verified in-app updates through Settings.
          files: |
            native-prototype/release/YTMusicLite-v5.0.0-win-x64.zip
            native-prototype/release/YTMusicLite-v5.0.0-win-x64.zip.sha256

[package]
name = "yt-music-lite"
version = "7.0.0"
description = "Low-memory YouTube Music client for Windows"
authors = ["YT Music Lite"]
edition = "2021"

[lib]
name = "ytm_desktop_option3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "rt-multi-thread", "fs", "time"] }
ytmusic-api = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
semver = "1"
sha2 = "0.10"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
